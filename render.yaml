# Déploiement Render (Blueprint) : New > Blueprint > choisir le dépôt ups-expeditions
# Coût : instance 0.5c-512mb (Starter, 7 $/mois) + disque 1 Go (0,25 $/mois)
# IMPORTANT : une variable écrite ici avec « value: » est RÉÉCRITE par Render à chaque modification de ce fichier.
# Toutes les variables réglables sont donc en « sync: false » : on les règle uniquement dans Render → Environment.
services:
  - type: web
    runtime: node
    name: ups-expeditions
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    disk:
      name: ups-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # --- Fonctionnement ---
      - key: DATA_DIR
        value: /var/data
      - key: TZ
        value: Europe/Paris
      - key: APP_PASSWORD          # mot de passe pour ouvrir l'application
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # --- UPS ---
      - key: UPS_ENV
        sync: false
      - key: UPS_CLIENT_ID
        sync: false
      - key: UPS_CLIENT_SECRET
        sync: false
      - key: UPS_ACCOUNT_NUMBER
        sync: false
      - key: UPS_NEGOTIATED_RATES
        sync: false
      - key: UPS_DDP
        sync: false
      - key: UPS_LABEL_FORMAT
        sync: false
      # --- Expéditeur ---
      - key: SHIPPER_NAME
        sync: false
      - key: SHIPPER_ADDRESS1
        sync: false
      - key: SHIPPER_CITY
        sync: false
      - key: SHIPPER_POSTAL_CODE
        sync: false
      - key: SHIPPER_COUNTRY
        sync: false
      - key: SHIPPER_PHONE
        sync: false
      - key: SHIPPER_EMAIL
        sync: false
      # --- eBay ---
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_RUNAME
        sync: false
      # --- Etsy ---
      - key: ETSY_KEYSTRING
        sync: false
      - key: ETSY_SHARED_SECRET
        sync: false
      # --- Shopify ---
      - key: SHOPIFY_SHOP
        sync: false
      - key: SHOPIFY_AUTH_MODE
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
